# Fluxo temporário de manutenção: normalização de comentários do corretivo desktop.
name: DevIN temporary desktop layout documentation normalization # Explicação DevIN: Nomeia manutenção temporária de comentários.
on: # Explicação DevIN: Define eventos de execução.
  push: # Explicação DevIN: Executa somente na criação do arquivo.
    branches: [main] # Explicação DevIN: Restringe a main.
    paths: ['.github/workflows/one-time-desktop-layout-normalize.yml'] # Explicação DevIN: Evita execuções repetidas.
permissions: # Explicação DevIN: Limita permissões do GitHub Actions.
  contents: write # Explicação DevIN: Permite corrigir formatação nos arquivos autorizados.
jobs: # Explicação DevIN: Define trabalhos.
  normalize: # Explicação DevIN: Declara normalizador temporário.
    runs-on: ubuntu-latest # Explicação DevIN: Usa Linux para executar o normalizador.
    steps: # Explicação DevIN: Define passos da rotina.
      - uses: actions/checkout@v4 # Explicação DevIN: Obtém os arquivos versionados.
        with: # Explicação DevIN: Ajusta credenciais.
          persist-credentials: true # Explicação DevIN: Permite publicar correção documental.
      - uses: actions/setup-python@v5 # Explicação DevIN: Prepara interpretador Python.
        with: # Explicação DevIN: Define configuração do Python.
          python-version: '3.12' # Explicação DevIN: Usa versão suportada pelo projeto.
      - name: Normalize project inline comments # Explicação DevIN: Executa normalizador oficial do DevIN.
        run: python3 scripts/line_explanations.py --write # Explicação DevIN: Padroniza somente os comentários explicativos.
      - name: Commit affected files only # Explicação DevIN: Limita as alterações ao escopo identificado.
        shell: bash # Explicação DevIN: Usa shell bash.
        run: | # Explicação DevIN: Executa script de publicação.
          set -euo pipefail # Explicação DevIN: Encerra em caso de erro.
          git add js/dashboard.js tests/ui-consistency.test.cjs tests/admin-overview.test.cjs docs/SQL_DIAGNOSTICO_LEITURA_DEVIN.sql # Explicação DevIN: Inclui apenas os arquivos apontados pela verificação.
          if ! git diff --cached --quiet; then # Explicação DevIN: Evita publicar commit vazio.
            git config user.name 'github-actions[bot]' # Explicação DevIN: Define autoria do fluxo.
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # Explicação DevIN: Usa e-mail do bot.
            git commit -m "docs: normalize desktop layout regression comments" # Explicação DevIN: Registra alteração de comentários.
            git push origin HEAD:main # Explicação DevIN: Publica atualização de comentários na main.
          fi # Explicação DevIN: Encerra teste de alterações.
