# Uso exclusivo da normalização documental desta revisão; será removido após execução.
name: DevIN temporary responsive UI line normalization # Explicação DevIN: Identifica fluxo temporário de manutenção.
on: # Explicação DevIN: Define acionamento do fluxo.
  push: # Explicação DevIN: Permite execução após criar este arquivo.
    branches: [main] # Explicação DevIN: Limita a branch principal.
    paths: ['.github/workflows/one-time-ui-normalize.yml'] # Explicação DevIN: Não é acionado por alterações posteriores.
permissions: # Explicação DevIN: Declara permissões da automação.
  contents: write # Explicação DevIN: Autoriza apenas gravar a normalização de fontes.
jobs: # Explicação DevIN: Define trabalhos do fluxo.
  normalize: # Explicação DevIN: Executa uma única etapa de padronização.
    runs-on: ubuntu-latest # Explicação DevIN: Usa máquina Linux da CI.
    steps: # Explicação DevIN: Configura as ações.
      - uses: actions/checkout@v4 # Explicação DevIN: Obtém código da main.
        with: # Explicação DevIN: Define opções do checkout.
          persist-credentials: true # Explicação DevIN: Permite publicar a correção técnica.
      - uses: actions/setup-python@v5 # Explicação DevIN: Configura Python.
        with: # Explicação DevIN: Define versão do interpretador.
          python-version: '3.12' # Explicação DevIN: Executa normalizador existente.
      - name: Apply official inline explanations # Explicação DevIN: Processa somente formatação de documentação.
        run: python3 scripts/line_explanations.py --write # Explicação DevIN: Reusa o script oficial do projeto.
      - name: Commit affected source files only # Explicação DevIN: Evita permissão de workflow do bot.
        shell: bash # Explicação DevIN: Utiliza shell bash.
        run: | # Explicação DevIN: Inicia script seguro de publicação.
          set -euo pipefail # Explicação DevIN: Interrompe ao ocorrer falha.
          git add css/ui-consistency.css html/index.html html/login.html html/cadastro_pessoa.html html/cadastro_empresa.html html/politica_privacidade.html js/dashboard.js php/adm.php php/arcade.php php/cadastro_empresa.php php/cadastro_pessoa.php php/curriculo_abnt.php php/curriculo_onboarding.php php/empresa.php php/helpers.php php/login.php php/pessoa.php php/recuperacao.php php/redefinir.php tests/ui-consistency.test.cjs # Explicação DevIN: Estagia somente estilos, scripts e páginas da auditoria.
          if ! git diff --cached --quiet; then # Explicação DevIN: Não cria commit vazio.
            git config user.name 'github-actions[bot]' # Explicação DevIN: Identifica manutenção.
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # Explicação DevIN: Usa identidade do bot.
            git commit -m "docs: normalize responsive UI inline explanations" # Explicação DevIN: Registra apenas comentários.
            git push origin HEAD:main # Explicação DevIN: Publica correções na main.
          fi # Explicação DevIN: Fecha condição de alterações.
