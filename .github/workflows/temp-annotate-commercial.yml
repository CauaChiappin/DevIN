name: DevIN commercial - annotate sources temporarily
on:
  push:
    branches: [production/monetization]
    paths: ['.github/workflows/temp-annotate-commercial.yml']
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explain source lines in their actual PHP and SQL files
        run: python3 scripts/line_explanations.py --write
      - name: Commit only the commercial code and tests (not workflow)
        run: |
          git add .env.example database/migrations/2026_11_18_007_commercial_draft.sql php/api/commercial/plans.php php/controllers/BrazilianRegistry.php php/controllers/CommercialEntitlements.php php/controllers/CommercialPlanCatalog.php tests/commercial_basics.php tests/commercial_mysql.php
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(commercial): annotate source code and migrations"
            git push origin HEAD:production/monetization
          fi
