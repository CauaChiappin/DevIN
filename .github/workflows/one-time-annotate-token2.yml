name: DevIN - annotator Token2 (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-annotate-token2.yml'
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar explicacoes por linha com o gerador oficial
        run: python3 scripts/line_explanations.py --write
      - name: Registrar apenas codigo de Token 2 e testes
        run: |
          git add php/controllers/Jarvis/Api.php php/admin_security_ai.php php/components/jarvis-admin-widget.php tests/jarvis_admin_mysql.php .github/workflows/jarvis-admin-checks.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(security): comentarios inline nas rotas de Token 2"
            git push origin HEAD:main
          fi
