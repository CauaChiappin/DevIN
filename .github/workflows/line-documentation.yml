      - '.github/workflows/line-documentation.yml' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
  workflow_dispatch: # Explicação DevIN: Configura propriedade YAML (campo workflow_dispatch).

permissions: # Explicação DevIN: Configura permissões do workflow (campo permissions).
  contents: read # Explicação DevIN: Configura propriedade YAML (campo contents).

jobs: # Explicação DevIN: Configura conjunto de trabalhos do workflow (campo jobs).
  verify-inline: # Explicação DevIN: Configura propriedade YAML (campo verify-inline).
    runs-on: ubuntu-latest # Explicação DevIN: Configura ambiente executor (campo runs-on).
    steps: # Explicação DevIN: Configura sequência de etapas (campo steps).
      - uses: actions/checkout@v4 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - uses: actions/setup-python@v5 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        with: # Explicação DevIN: Configura propriedade YAML (campo with).
          python-version: '3.12' # Explicação DevIN: Configura propriedade YAML (campo python-version).
      - name: Check inline explanations # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        run: python3 scripts/line_explanations.py --check # Explicação DevIN: Configura comando de execução (campo run).
      - name: Test explanation generation # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        run: python3 -m unittest discover -s tests -p 'test_line_explanations.py' # Explicação DevIN: Configura comando de execução (campo run).
