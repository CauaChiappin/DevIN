  mysql: # Explicação DevIN: Configura propriedade YAML (campo mysql).
    runs-on: ubuntu-latest # Explicação DevIN: Configura ambiente executor (campo runs-on).
    strategy: # Explicação DevIN: Configura propriedade YAML (campo strategy).
      matrix: # Explicação DevIN: Configura propriedade YAML (campo matrix).
        php-version: ['8.1', '8.5'] # Explicação DevIN: Configura propriedade YAML (campo php-version).
    permissions: # Explicação DevIN: Configura permissões do workflow (campo permissions).
      contents: read # Explicação DevIN: Configura propriedade YAML (campo contents).
    services: # Explicação DevIN: Configura serviços auxiliares (campo services).
      mysql: # Explicação DevIN: Configura propriedade YAML (campo mysql).
        image: mysql:8.0 # Explicação DevIN: Configura propriedade YAML (campo image).
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          MYSQL_ROOT_PASSWORD: jarvis-ci-only # Explicação DevIN: Configura propriedade YAML (campo MYSQL_ROOT_PASSWORD).
          MYSQL_DATABASE: devin_jarvis_ci # Explicação DevIN: Configura propriedade YAML (campo MYSQL_DATABASE).
        ports: # Explicação DevIN: Configura propriedade YAML (campo ports).
          - 3306:3306 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        options: >- # Explicação DevIN: Configura propriedade YAML (campo options).
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pjarvis-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps: # Explicação DevIN: Configura sequência de etapas (campo steps).
      - uses: actions/checkout@v4 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - name: Set up supported PHP # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        uses: shivammathur/setup-php@v2 # Explicação DevIN: Configura ação reutilizável (campo uses).
        with: # Explicação DevIN: Configura propriedade YAML (campo with).
          php-version: ${{ matrix.php-version }} # Explicação DevIN: Configura propriedade YAML (campo php-version).
          extensions: curl, mbstring, mysqli # Explicação DevIN: Configura propriedade YAML (campo extensions).
      - name: Install MySQL client for isolated tests # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        run: | # Explicação DevIN: Configura comando de execução (campo run).
          sudo apt-get update -qq # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          sudo apt-get install -y default-mysql-client # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
      - name: Migrate disposable MySQL database # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          MYSQL_PWD: jarvis-ci-only # Explicação DevIN: Configura propriedade YAML (campo MYSQL_PWD).
        run: | # Explicação DevIN: Configura comando de execução (campo run).
          mysql -h 127.0.0.1 -u root devin_jarvis_ci < database/migrations/jarvis_admin.sql # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          mysql -h 127.0.0.1 -u root devin_jarvis_ci < database/migrations/jarvis_admin_controlled_actions.sql # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          test "$(mysql -h 127.0.0.1 -u root -N -s devin_jarvis_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='devin_jarvis_ci'")" -eq 6 # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
      - name: Persistence, access control and no-2FA integration # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          JARVIS_TEST_HOST: 127.0.0.1 # Explicação DevIN: Configura propriedade YAML (campo JARVIS_TEST_HOST).
          JARVIS_TEST_DB: devin_jarvis_ci # Explicação DevIN: Configura propriedade YAML (campo JARVIS_TEST_DB).
          JARVIS_TEST_USER: root # Explicação DevIN: Configura propriedade YAML (campo JARVIS_TEST_USER).
          JARVIS_TEST_PASSWORD: jarvis-ci-only # Explicação DevIN: Configura propriedade YAML (campo JARVIS_TEST_PASSWORD).
        run: php tests/jarvis_admin_mysql.php # Explicação DevIN: Configura comando de execução (campo run).
