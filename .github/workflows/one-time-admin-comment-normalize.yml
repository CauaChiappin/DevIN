name: DevIN temporary safe template normalization
on:
  push:
    branches:
      - fix/admin-overview-visible-comments-20261119
    paths:
      - .github/workflows/one-time-admin-comment-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/line_explanations.py --write
      - run: |
          set -euo pipefail
          git add php/components/admin-overview.php tests/admin-overview.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: normalize PHP-to-HTML boundary annotations"
            git push origin HEAD:fix/admin-overview-visible-comments-20261119
          fi
