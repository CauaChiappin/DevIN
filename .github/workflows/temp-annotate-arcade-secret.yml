name: DevIN - anotacoes do segredo Arcade (temporario)
on:
  push:
    branches: [feat/arcade-mobile-easter-egg-sobre-nos-20261117]
    paths: ['.github/workflows/temp-annotate-arcade-secret.yml']
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar comentarios inline segundo padrao do DevIN
        run: python3 scripts/line_explanations.py --write
      - name: Persistir somente arquivos modificados para o easter egg
        run: |
          git add .github/workflows/jarvis-admin-checks.yml css/dashboard.css js/mobile-arcade-secret.js php/adm.php php/empresa.php php/helpers.php php/pessoa.php tests/arcade-mobile-secret.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(arcade): completar comentarios inline no easter egg mobile"
            git push origin HEAD:feat/arcade-mobile-easter-egg-sobre-nos-20261117
          fi
