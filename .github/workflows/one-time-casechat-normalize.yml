name: DevIN temporary case chat JS normalizer
on:
  push:
    branches:
      - feature/jarvis-case-chat-reports-vision-resume-audit-20261120
    paths:
      - .github/workflows/one-time-casechat-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/line_explanations.py --write
      - run: |
          set -euo pipefail
          git add js/jarvis-admin.js js/jarvis-cases.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: normalize case selection and conversation reset"
            git push origin HEAD:feature/jarvis-case-chat-reports-vision-resume-audit-20261120
          fi
