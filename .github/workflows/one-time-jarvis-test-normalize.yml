name: DevIN normalize single chat regression test
on:
  push:
    branches:
      - fix/jarvis-support-detail-owner-mobile-20261120
    paths:
      - .github/workflows/one-time-jarvis-test-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/line_explanations.py --write
      - run: |
          set -euo pipefail
          git add tests/jarvis-cases.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: normalize case-detail regression assertion"
            git push origin HEAD:fix/jarvis-support-detail-owner-mobile-20261120
          fi
