name: DevIN - annotation search by name (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-annotate-search-by-name.yml'
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate code annotations using repository script
        run: python3 scripts/line_explanations.py --write
      - name: Commit relevant source files only
        run: |
          git add js/jarvis-admin.js php/api/jarvis/admin_tools.php php/controllers/Jarvis/JarvisAdminRecords.php tests/jarvis-chat-commands.test.cjs tests/jarvis_admin_smoke.php
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(jarvis): annotate search by name and relevant tests"
            git push origin HEAD:main
          fi
