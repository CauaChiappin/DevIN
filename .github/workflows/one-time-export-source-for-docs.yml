name: DevIN - exportar codigo versionado para documentacao (temporario)
on:
  push:
    branches:
      - docs/export-source-17nov2026
    paths:
      - '.github/workflows/one-time-export-source-for-docs.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arquivar somente arquivos textuais versionados, sem segredos e uploads
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, pathlib, json, zipfile
          allowed={'.php','.js','.cjs','.mjs','.ts','.css','.html','.htm','.sql','.yml','.yaml','.sh','.json','.xml','.svg','.py'}
          explicit={'.env.example','.htaccess','.gitignore','composer.lock','composer.json'}
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[]
          for p in tracked:
              if not p or p.startswith(('.git/','storage/','vendor/','php/uploads/','node_modules/')): continue
              if p=='.github/workflows/one-time-export-source-for-docs.yml':continue
              if pathlib.Path(p).suffix.lower() not in allowed and pathlib.Path(p).name not in explicit:continue
              if not pathlib.Path(p).is_file(): continue
              raw=pathlib.Path(p).read_bytes()
              if b'\0' in raw[:4096] or len(raw)>1000000: continue
              selected.append((p,raw))
          out='/tmp/DevIN_main_source_versioned.zip'
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              z.writestr('SOURCE_INFO.json',json.dumps({'source_commit':'7214b580b4a0165e7a334fc4ab5be567fc2c9f03','branch':'main','files':len(selected),'excluded':'untracked files, private .env, user uploads, binaries, libraries and external dependencies'},indent=2))
              for p,raw in selected:z.writestr('source/'+p,raw)
          print('Selected files:',len(selected),'Archive:',out)
          PY
      - name: Publicar artefato transitório apenas para a atualização documental
        uses: actions/upload-artifact@v4
        with:
          name: devin-main-7214b580-source
          path: /tmp/DevIN_main_source_versioned.zip
          retention-days: 1
