name: DevIN — revisar comentários mobile (temporário)
on:
  push:
    branches: [feat/support-mobile-first-20261117]
    paths: ['.github/workflows/one-time-annotate-mobile-support.yml']
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comentários inline nos trechos mobile
        run: python3 scripts/line_explanations.py --write
      - name: Registrar comentários do suporte responsivo
        run: |
          git add css/support.css js/support-ui.js php/suporte.php php/components/support-admin.php tests/support-ui.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(support/mobile): explicar linhas de layout e navegacao"
            git push origin HEAD:feat/support-mobile-first-20261117
          fi
