name: DevIN temporary natural-language intent annotations (rerun)
on:
  push:
    branches:
      - fix/jarvis-natural-local-intents-20261120
    paths:
      - .github/workflows/one-time-jarvis-natural-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize source explanations
        run: python3 scripts/line_explanations.py --write
      - name: Commit source changes without changing workflow files
        run: |
          set -euo pipefail
          git add js/jarvis-intents.js js/jarvis-cases.js tests/jarvis-intents.test.cjs tests/jarvis-cases.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: normalize natural-language intent and regression annotations"
            git push origin HEAD:fix/jarvis-natural-local-intents-20261120
          fi
