name: DevIN - annotation final names (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-annotate-final-names.yml'
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar explicacoes inline
        run: python3 scripts/line_explanations.py --write
      - name: Registrar codigo revisado
        run: |
          git add js/jarvis-admin.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(jarvis): explicar linhas do parser de nome"
            git push origin HEAD:main
          fi
