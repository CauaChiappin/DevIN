name: DevIN Mobile Support - anotacoes temporarias
on:
  push:
    branches: [feat/support-mobile-ux-20261117]
    paths: ['.github/workflows/temp-annotate-mobile-support.yml']
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar explicacoes inline do projeto sem alterar a logica
        run: python3 scripts/line_explanations.py --write
      - name: Salvar apenas arquivos alterados pelo trabalho mobile
        run: |
          git add css/support.css js/support-ui.js php/suporte.php php/components/support-admin.php tests/support-ui.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(mobile): completar comentarios linha a linha no suporte"
            git push origin HEAD:feat/support-mobile-ux-20261117
          fi
