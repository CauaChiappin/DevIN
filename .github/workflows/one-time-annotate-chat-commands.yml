name: DevIN - annotate chat commands (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-annotate-chat-commands.yml'
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Annotate code via official repository script
        run: python3 scripts/line_explanations.py --write
      - name: Commit only JS and test changes
        run: |
          git add js/jarvis-admin.js tests/jarvis-chat-commands.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(jarvis): annotate chat commands and tests"
            git push origin HEAD:main
          fi
