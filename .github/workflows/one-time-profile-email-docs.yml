# Workflow temporário para documentar a correção; removido imediatamente após sucesso.
name: DevIN temporary profile email explanations # Explicação DevIN: Identifica manutenção temporária.
on: # Explicação DevIN: Configura evento de execução.
  push: # Explicação DevIN: Responde ao commit que adiciona este arquivo.
    branches: [main] # Explicação DevIN: Limita à branch principal.
    paths: ['.github/workflows/one-time-profile-email-docs.yml'] # Explicação DevIN: Evita execução recorrente.
permissions: # Explicação DevIN: Define permissões do GitHub Actions.
  contents: write # Explicação DevIN: Permite commit de documentação no mesmo repositório.
jobs: # Explicação DevIN: Define as tarefas de manutenção.
  annotate: # Explicação DevIN: Executa o normalizador já existente no projeto.
    runs-on: ubuntu-latest # Explicação DevIN: Usa um executor Linux.
    steps: # Explicação DevIN: Define a sequência.
      - uses: actions/checkout@v4 # Explicação DevIN: Obtém os arquivos da branch.
        with: # Explicação DevIN: Configura checkout do GitHub.
          persist-credentials: true # Explicação DevIN: Conserva credenciais para publicar o commit.
      - uses: actions/setup-python@v5 # Explicação DevIN: Prepara ambiente Python.
        with: # Explicação DevIN: Informa versão suportada.
          python-version: '3.12' # Explicação DevIN: Compatível com script de comentários.
      - name: Normalize inline explanations # Explicação DevIN: Prepara documentação de linhas alteradas.
        run: python3 scripts/line_explanations.py --write # Explicação DevIN: Usa o normalizador oficial do projeto.
      - name: Commit only profile email changes # Explicação DevIN: Evita gravar ajustes em outros componentes.
        shell: bash # Explicação DevIN: Executa comandos bash.
        run: | # Explicação DevIN: Inicia o script de commit.
          set -euo pipefail # Explicação DevIN: Interrompe o job ao encontrar erro.
          git add .github/workflows/jarvis-admin-checks.yml js/dashboard-i18n.js php/adm.php php/controllers/ProfileController.php php/empresa.php php/pessoa.php tests/profile-email-ui.test.cjs tests/profile_email_change_mysql.php # Explicação DevIN: Inclui somente os arquivos da correção.
          if ! git diff --cached --quiet; then # Explicação DevIN: Evita commit vazio.
            git config user.name 'github-actions[bot]' # Explicação DevIN: Identifica o autor técnico.
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # Explicação DevIN: Usa identidade pública do bot.
            git commit -m "docs: normalize inline profile email change explanations" # Explicação DevIN: Registra a normalização.
            git push origin HEAD:main # Explicação DevIN: Publica na branch principal.
          fi # Explicação DevIN: Finaliza o bloco condicional.
