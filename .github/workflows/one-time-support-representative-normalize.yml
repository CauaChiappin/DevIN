name: DevIN temporary representative annotation normalizer
on:
  push:
    branches:
      - fix/support-representative-ownership-20261120
    paths:
      - .github/workflows/one-time-support-representative-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/line_explanations.py --write
      - run: |
          set -euo pipefail
          git add php/controllers/SupportDesk.php php/controllers/SupportRepresentative.php php/support_api.php php/controllers/Jarvis/JarvisCaseDesk.php php/api/jarvis/cases.php php/components/support-admin.php js/support-ui.js js/jarvis-cases.js css/support.css tests/support_center_mysql.php tests/support-ui.test.cjs tests/jarvis-cases.test.cjs database/migrations/2026_11_20_008_support_representatives.sql
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: normalize support representative annotations"
            git push origin HEAD:fix/support-representative-ownership-20261120
          fi
