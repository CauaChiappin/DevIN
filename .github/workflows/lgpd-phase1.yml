name: LGPD Fase 1 — privacy services and MySQL
on:
  push:
    branches:
      - feature/lgpd-phase1-foundation
  pull_request:
    paths:
      - 'php/controllers/Privacy/**'
      - 'php/controllers/Security/**'
      - 'php/api/admin_security.php'
      - 'php/admin_token2.php'
      - 'scripts/issue-admin-token2-activation.php'
      - 'php/admin_security_gate.php'
      - 'php/adm.php'
      - 'php/arcade_api.php'
      - 'scripts/provision-admin-token2.php'
      - 'tests/admin_stepup_integration.php'
      - 'tests/admin_token2_permanent_integration.php'
      - 'php/JarvisT.php'
      - 'database/migrations/**'
      - 'tests/privacy_phase1_*.php'
      - 'php/login.php'
      - 'php/cadastro_*.php'
      - 'php/processar.php'
      - 'php/pessoa.php'
      - 'php/empresa.php'
      - '.github/workflows/lgpd-phase1.yml'
jobs:
  privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: devin-ci-temporary-only
          MYSQL_DATABASE: devin_lgpd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdevin-ci-temporary-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-mbstring default-mysql-client
          composer install --no-interaction --no-ansi --no-progress --prefer-dist --no-scripts
      - name: PHP syntax validation
        run: |
          for f in php/controllers/Privacy/*.php php/controllers/Security/*.php tests/privacy_phase1_*.php tests/admin_stepup_integration.php tests/admin_token2_permanent_integration.php php/api/admin_security.php php/admin_security_gate.php php/admin_token2.php scripts/issue-admin-token2-activation.php scripts/provision-admin-token2.php php/login.php php/cadastro_pessoa.php php/cadastro_empresa.php php/processar.php php/pessoa.php php/empresa.php php/adm.php php/arcade_api.php php/controllers/AuthController.php; do php -l "$f"; done
      - name: Privacy helpers unit tests
        run: php tests/privacy_phase1_unit.php
      - name: Apply additive migration to disposable MySQL
        env:
          MYSQL_PWD: devin-ci-temporary-only
        run: |
          mysql --host=127.0.0.1 --user=root devin_lgpd_test < database/migrations/2026_11_09_001_lgpd_foundation.sql
          mysql --host=127.0.0.1 --user=root devin_lgpd_test -e "CREATE TABLE administrador (id_administrador INT NOT NULL PRIMARY KEY) ENGINE=InnoDB"
          mysql --host=127.0.0.1 --user=root devin_lgpd_test < database/migrations/2026_11_09_002_admin_stepup.sql
          mysql --host=127.0.0.1 --user=root devin_lgpd_test < database/migrations/2026_11_09_003_admin_token2_enrollment.sql
          test "$(MYSQL_PWD=devin-ci-temporary-only mysql --host=127.0.0.1 --user=root --batch --skip-column-names devin_lgpd_test -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='devin_lgpd_test'")" -eq 11
      - name: Privacy MySQL integration tests
        env:
          LGPD_TEST_HOST: 127.0.0.1
          LGPD_TEST_DB: devin_lgpd_test
          LGPD_TEST_USER: root
          LGPD_TEST_PASSWORD: devin-ci-temporary-only
        run: php tests/privacy_phase1_integration.php
      - name: Permanent self-selected Token 2 specification
        env:
          LGPD_TEST_HOST: 127.0.0.1
          LGPD_TEST_DB: devin_lgpd_test
          LGPD_TEST_USER: root
          LGPD_TEST_PASSWORD: devin-ci-temporary-only
        run: php tests/admin_token2_permanent_integration.php
      - name: Administrative step-up integration tests
        env:
          LGPD_TEST_HOST: 127.0.0.1
          LGPD_TEST_DB: devin_lgpd_test
          LGPD_TEST_USER: root
          LGPD_TEST_PASSWORD: devin-ci-temporary-only
        run: php tests/admin_stepup_integration.php
