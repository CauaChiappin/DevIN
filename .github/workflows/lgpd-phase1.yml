name: LGPD Fase 1 — privacy services and MySQL # Explicação DevIN: Configura nome identificador (campo name).
on: # Explicação DevIN: Configura acionadores do workflow (campo on).
  push: # Explicação DevIN: Configura propriedade YAML (campo push).
    branches: # Explicação DevIN: Configura filtro de branches (campo branches).
      - feature/lgpd-phase1-foundation # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
  pull_request: # Explicação DevIN: Configura propriedade YAML (campo pull_request).
    paths: # Explicação DevIN: Configura filtro de caminhos (campo paths).
      - 'php/controllers/Privacy/**' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/controllers/Security/**' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/api/admin_security.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/admin_token2.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/JarvisT.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/admin_security_gate.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/adm.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/arcade_api.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'scripts/provision-admin-token2.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'tests/admin_stepup_integration.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'tests/admin_token2_permanent_integration.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'database/migrations/**' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'tests/privacy_phase1_*.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/login.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/cadastro_*.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/processar.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/pessoa.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'php/empresa.php' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'composer.json' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - 'composer.lock' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - '.github/workflows/lgpd-phase1.yml' # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
jobs: # Explicação DevIN: Configura conjunto de trabalhos do workflow (campo jobs).
  privacy: # Explicação DevIN: Configura propriedade YAML (campo privacy).
    runs-on: ubuntu-latest # Explicação DevIN: Configura ambiente executor (campo runs-on).
    strategy: # Explicação DevIN: Configura propriedade YAML (campo strategy).
      matrix: # Explicação DevIN: Configura propriedade YAML (campo matrix).
        php-version: ['8.1', '8.5'] # Explicação DevIN: Configura propriedade YAML (campo php-version).
    permissions: # Explicação DevIN: Configura permissões do workflow (campo permissions).
      contents: read # Explicação DevIN: Configura propriedade YAML (campo contents).
    services: # Explicação DevIN: Configura serviços auxiliares (campo services).
      mysql: # Explicação DevIN: Configura propriedade YAML (campo mysql).
        image: mysql:8.0 # Explicação DevIN: Configura propriedade YAML (campo image).
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          MYSQL_ROOT_PASSWORD: devin-ci-temporary-only # Explicação DevIN: Configura propriedade YAML (campo MYSQL_ROOT_PASSWORD).
          MYSQL_DATABASE: devin_lgpd_test # Explicação DevIN: Configura propriedade YAML (campo MYSQL_DATABASE).
        ports: # Explicação DevIN: Configura propriedade YAML (campo ports).
          - 3306:3306 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        options: >- # Explicação DevIN: Configura propriedade YAML (campo options).
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdevin-ci-temporary-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps: # Explicação DevIN: Configura sequência de etapas (campo steps).
      - uses: actions/checkout@v4 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
      - name: Set up supported PHP # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        uses: shivammathur/setup-php@v2 # Explicação DevIN: Configura ação reutilizável (campo uses).
        with: # Explicação DevIN: Configura propriedade YAML (campo with).
          php-version: ${{ matrix.php-version }} # Explicação DevIN: Configura propriedade YAML (campo php-version).
          extensions: mbstring, mysqli # Explicação DevIN: Configura propriedade YAML (campo extensions).
      - name: Install disposable test dependencies # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        run: | # Explicação DevIN: Configura comando de execução (campo run).
          sudo apt-get update -qq # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          sudo apt-get install -y default-mysql-client # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          composer install --no-interaction --no-ansi --no-progress --prefer-dist --no-scripts # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
      - name: PHP syntax validation # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        run: | # Explicação DevIN: Configura comando de execução (campo run).
          for f in php/controllers/Privacy/*.php php/controllers/Security/*.php tests/privacy_phase1_*.php tests/admin_stepup_integration.php tests/admin_token2_permanent_integration.php php/api/admin_security.php php/admin_security_gate.php php/admin_token2.php php/JarvisT.php scripts/provision-admin-token2.php php/login.php php/cadastro_pessoa.php php/cadastro_empresa.php php/processar.php php/pessoa.php php/empresa.php php/adm.php php/arcade_api.php php/controllers/AuthController.php; do php -l "$f"; done # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
      - name: Privacy helpers unit tests # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        run: php tests/privacy_phase1_unit.php # Explicação DevIN: Configura comando de execução (campo run).
      - name: Apply additive migration to disposable MySQL # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          MYSQL_PWD: devin-ci-temporary-only # Explicação DevIN: Configura propriedade YAML (campo MYSQL_PWD).
        run: | # Explicação DevIN: Configura comando de execução (campo run).
          mysql --host=127.0.0.1 --user=root devin_lgpd_test < database/migrations/2026_11_09_001_lgpd_foundation.sql # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          mysql --host=127.0.0.1 --user=root devin_lgpd_test -e "CREATE TABLE administrador (id_administrador INT NOT NULL PRIMARY KEY) ENGINE=InnoDB" # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          mysql --host=127.0.0.1 --user=root devin_lgpd_test < database/migrations/2026_11_09_002_admin_stepup.sql # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          test "$(MYSQL_PWD=devin-ci-temporary-only mysql --host=127.0.0.1 --user=root --batch --skip-column-names devin_lgpd_test -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='devin_lgpd_test'")" -eq 10 # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
      - name: Privacy MySQL integration tests # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          LGPD_TEST_HOST: 127.0.0.1 # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_HOST).
          LGPD_TEST_DB: devin_lgpd_test # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_DB).
          LGPD_TEST_USER: root # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_USER).
          LGPD_TEST_PASSWORD: devin-ci-temporary-only # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_PASSWORD).
        run: php tests/privacy_phase1_integration.php # Explicação DevIN: Configura comando de execução (campo run).
      - name: Permanent self-selected Token 2 specification # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          LGPD_TEST_HOST: 127.0.0.1 # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_HOST).
          LGPD_TEST_DB: devin_lgpd_test # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_DB).
          LGPD_TEST_USER: root # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_USER).
          LGPD_TEST_PASSWORD: devin-ci-temporary-only # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_PASSWORD).
        run: php tests/admin_token2_permanent_integration.php # Explicação DevIN: Configura comando de execução (campo run).
      - name: Administrative step-up integration tests # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        env: # Explicação DevIN: Configura variáveis de ambiente (campo env).
          LGPD_TEST_HOST: 127.0.0.1 # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_HOST).
          LGPD_TEST_DB: devin_lgpd_test # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_DB).
          LGPD_TEST_USER: root # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_USER).
          LGPD_TEST_PASSWORD: devin-ci-temporary-only # Explicação DevIN: Configura propriedade YAML (campo LGPD_TEST_PASSWORD).
        run: php tests/admin_stepup_integration.php # Explicação DevIN: Configura comando de execução (campo run).
