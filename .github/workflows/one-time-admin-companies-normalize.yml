# Fluxo temporário: adota o formato de explicações exigido pela CI e será removido após uso.
name: DevIN temporary admin companies normalization # Explicação DevIN: Identifica manutenção pontual do painel ADM.
on: # Explicação DevIN: Configura o evento de execução do fluxo.
  push: # Explicação DevIN: Executa quando criado na branch main.
    branches: [main] # Explicação DevIN: Restringe a branch principal.
    paths: ['.github/workflows/one-time-admin-companies-normalize.yml'] # Explicação DevIN: Evita repetições em outras alterações.
permissions: # Explicação DevIN: Define as permissões do workflow.
  contents: write # Explicação DevIN: Permite escrever os arquivos de fonte autorizados.
jobs: # Explicação DevIN: Declara tarefas do workflow.
  normalize: # Explicação DevIN: Executa a normalização dos comentários.
    runs-on: ubuntu-latest # Explicação DevIN: Usa executor Linux para o script Python.
    steps: # Explicação DevIN: Define a sequência de ações.
      - uses: actions/checkout@v4 # Explicação DevIN: Obtém os arquivos do repositório.
        with: # Explicação DevIN: Define os argumentos do checkout.
          persist-credentials: true # Explicação DevIN: Permite publicar o commit de manutenção.
      - uses: actions/setup-python@v5 # Explicação DevIN: Prepara o interpretador Python.
        with: # Explicação DevIN: Configura a versão do interpretador.
          python-version: '3.12' # Explicação DevIN: Compatível com o normalizador existente.
      - name: Normalize inline comments # Explicação DevIN: Segue o padrão oficial de comentários do DevIN.
        run: python3 scripts/line_explanations.py --write # Explicação DevIN: Normaliza os comentários sem editar a lógica.
      - name: Commit only files from admin correction # Explicação DevIN: Evita tocar em módulos não solicitados.
        shell: bash # Explicação DevIN: Executa com bash.
        run: | # Explicação DevIN: Inicia os comandos de publicação.
          set -euo pipefail # Explicação DevIN: Para no primeiro erro.
          git add php/adm.php js/dashboard-i18n.js tests/admin-dashboard-sections.test.cjs # Explicação DevIN: Seleciona exclusivamente código e testes do painel ADM.
          if ! git diff --cached --quiet; then # Explicação DevIN: Evita commits desnecessários.
            git config user.name 'github-actions[bot]' # Explicação DevIN: Identifica a conta automatizada.
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # Explicação DevIN: Usa endereço público da conta bot.
            git commit -m "docs: normalize admin companies layout comments" # Explicação DevIN: Registra apenas a normalização.
            git push origin HEAD:main # Explicação DevIN: Publica na branch principal.
          fi # Explicação DevIN: Fecha o bloco de publicação.
