name: DevIN - anotacoes auditoria (temporario)
on:
  push:
    branches: [fix/auditoria-arcade-ia-20261117]
    paths: ['.github/workflows/one-time-annotate-audit.yml']
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comentarios inline com o script oficial ja presente
        run: python3 scripts/line_explanations.py --write
      - name: Salvar anotacoes somente nos arquivos corrigidos
        run: |
          git add php/arcade_api.php php/arcade.php php/adm.php php/empresa.php php/pessoa.php js/arcade-games.js php/controllers/ArcadeProgressPolicy.php php/controllers/ResumeReviewResult.php php/analisar_curriculo_abnt_api.php php/controllers/Jarvis/JarvisAdminRecords.php tests/arcade-extra-games.test.cjs tests/arcade_progress_policy.php tests/resume_abnt_contract.php tests/job_language_audit_extended.php
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(audit): anotacoes inline de correcoes e testes"
            git push origin HEAD:fix/auditoria-arcade-ia-20261117
          fi
