name: DevIN one-time semantic source annotation normalization
on:
  push:
    branches:
      - feat/jarvis-semantic-safe-router-20261120
    paths:
      - .github/workflows/one-time-jarvis-semantic-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply inline code documentation
        run: python3 scripts/line_explanations.py --write
      - name: Commit only changed source code
        shell: bash
        run: |
          set -euo pipefail
          git add php/controllers/Jarvis/JarvisSemanticIntent.php php/api/jarvis/intent.php js/jarvis-semantic.js js/jarvis-admin.js js/jarvis-cases.js php/adm.php php/components/jarvis-admin-widget.php tests/jarvis_semantic_intent.php tests/jarvis-semantic.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: normalize JARVIS semantic routing comments"
            git push origin HEAD:feat/jarvis-semantic-safe-router-20261120
          fi
