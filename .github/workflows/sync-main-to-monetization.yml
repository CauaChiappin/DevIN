# Mantém a branch comercial atualizada com tudo o que entrar na main.
# Não aplica squash nem force push; divergências são preservadas e conflitos falham.
name: Sync main into commercial production branch # Explicação DevIN: Configura nome identificador (campo name).
on: # Explicação DevIN: Configura acionadores do workflow (campo on).
  push: # Explicação DevIN: Configura propriedade YAML (campo push).
    branches: [main] # Explicação DevIN: Configura filtro de branches (campo branches).
  workflow_dispatch: # Explicação DevIN: Configura propriedade YAML (campo workflow_dispatch).
permissions: # Explicação DevIN: Configura permissões do workflow (campo permissions).
  contents: write # Explicação DevIN: Configura propriedade YAML (campo contents).
concurrency: # Explicação DevIN: Configura propriedade YAML (campo concurrency).
  group: sync-main-to-commercial # Explicação DevIN: Configura propriedade YAML (campo group).
  cancel-in-progress: false # Explicação DevIN: Configura propriedade YAML (campo cancel-in-progress).
jobs: # Explicação DevIN: Configura conjunto de trabalhos do workflow (campo jobs).
  sync: # Explicação DevIN: Configura propriedade YAML (campo sync).
    runs-on: ubuntu-latest # Explicação DevIN: Configura ambiente executor (campo runs-on).
    steps: # Explicação DevIN: Configura sequência de etapas (campo steps).
      - uses: actions/checkout@v4 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        with: # Explicação DevIN: Configura propriedade YAML (campo with).
          ref: production/monetization # Explicação DevIN: Configura propriedade YAML (campo ref).
          fetch-depth: 0 # Explicação DevIN: Configura propriedade YAML (campo fetch-depth).
          persist-credentials: true # Explicação DevIN: Configura propriedade YAML (campo persist-credentials).
      - name: Incorporate latest main without rewriting commercial history # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        shell: bash # Explicação DevIN: Configura propriedade YAML (campo shell).
        run: | # Explicação DevIN: Configura comando de execução (campo run).
          set -euo pipefail # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          git config user.name 'github-actions[bot]' # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          git fetch origin main production/monetization # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          git merge --no-edit origin/main # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          git push origin HEAD:production/monetization # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
