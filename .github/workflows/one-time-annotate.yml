# Execução temporária de manutenção: normaliza somente os arquivos corrigidos nesta entrega.
name: DevIN one-time inline normalization # Explicação DevIN: Configura nome identificador (campo name).
on: # Explicação DevIN: Configura acionadores do workflow (campo on).
  push: # Explicação DevIN: Configura propriedade YAML (campo push).
    branches: [main] # Explicação DevIN: Configura filtro de branches (campo branches).
    paths: ['.github/workflows/one-time-annotate.yml'] # Explicação DevIN: Configura filtro de caminhos (campo paths).
permissions: # Explicação DevIN: Configura permissões do workflow (campo permissions).
  contents: write # Explicação DevIN: Configura propriedade YAML (campo contents).
jobs: # Explicação DevIN: Configura conjunto de trabalhos (campo jobs).
  normalize: # Explicação DevIN: Configura propriedade YAML (campo normalize).
    runs-on: ubuntu-latest # Explicação DevIN: Configura ambiente executor (campo runs-on).
    steps: # Explicação DevIN: Configura sequência de etapas (campo steps).
      - uses: actions/checkout@v4 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        with: # Explicação DevIN: Configura propriedade YAML (campo with).
          persist-credentials: true # Explicação DevIN: Configura propriedade YAML (campo persist-credentials).
      - uses: actions/setup-python@v5 # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        with: # Explicação DevIN: Configura propriedade YAML (campo with).
          python-version: '3.12' # Explicação DevIN: Configura propriedade YAML (campo python-version).
      - name: Normalize the required source comments # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        run: python3 scripts/line_explanations.py --write # Explicação DevIN: Configura comando de execução (campo run).
      - name: Commit only this change set # Explicação DevIN: Adiciona item a uma lista da configuração YAML.
        shell: bash # Explicação DevIN: Configura propriedade YAML (campo shell).
        run: | # Explicação DevIN: Configura comando de execução (campo run).
          set -euo pipefail # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          git add js/dashboard-i18n.js js/support-ui.js js/mobile-arcade-secret.js tests/arcade-mobile-secret.test.cjs tests/support-i18n.test.cjs # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          if ! git diff --cached --quiet; then # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
            git config user.name 'github-actions[bot]' # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
            git commit -m "docs: normalize inline explanations for support translations and mobile arcade" # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
            git push origin HEAD:main # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
          fi # Explicação DevIN: Executa comando de automação ou configura argumento do shell.
