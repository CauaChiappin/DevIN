name: DevIN temporary mobile layout documentation normalize
on:
  push:
    branches:
      - fix/admin-stats-support-about-mobile-20261119
    paths:
      - .github/workflows/one-time-mobile-layout-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize all inline explanations
        run: python3 scripts/line_explanations.py --write
      - name: Commit only changed files for this UI fix
        shell: bash
        run: |
          set -euo pipefail
          git add css/ui-consistency.css css/dashboard.css css/support.css php/components/admin-overview.php js/support-ui.js tests/admin-overview.test.cjs tests/ui-consistency.test.cjs tests/support-ui.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: normalize explanations for admin mobile UI fixes"
            git push origin HEAD:fix/admin-stats-support-about-mobile-20261119
          fi
