<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <title>DevIN Arcade - Pac-Man</title>
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/site-navigation.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>
<body class="game-page">
    <div class="arcade-shell">
        <header class="arcade-header">
            <a class="arcade-logo" href="html/index.html">Dev<span>IN</span> Arcade</a>
            <button class="site-menu-toggle" type="button" aria-label="Abrir menu" aria-controls="site-menu" aria-expanded="false" data-site-menu-toggle>
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </button>
            <div class="site-menu" id="site-menu" data-site-menu>
                <nav class="arcade-nav" aria-label="Jogos">
                    <a class="arcade-button" href="html/index.html">Voltar ao site</a>
                    <a class="arcade-button" href="html/jogos/doom.html">Doom</a>
                </nav>
            </div>
        </header>

        <main class="emulator-stage">
            <section class="score-panel" aria-label="Pac-Man emulado">
                <div class="score-row"><strong>Jogo</strong><span>Pac-Man Arcade Enhanced</span></div>
                <p class="hint">Player emulado via Internet Archive. Clique no botao de energia do player para carregar o jogo.</p>
            </section>

            <div class="emulator-frame">
                <iframe
                    title="Pac-Man emulado"
                    src="https://archive.org/embed/pacmanae_a2600"
                    allow="fullscreen; autoplay; gamepad"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </main>

        <footer class="arcade-footer">
            <span>DevIN | Escola Profa. Alcina Dantas Feijao | 2026</span>
        </footer>
    </div>

<script src="js/site-navigation.js"></script>
</body>
</html>
