<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css?v=20260812-2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Devin|Login</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

    <header class="cabecalho-site">
        <a class="marca" href="index.html">Dev<span>IN</span></a>

        <nav class="navegacao" aria-label="Navegação principal">
            <a href="index.html#conheca">Conheça o DevIN</a>
            <a href="index.html#etapas">Etapas</a>
            <a href="index.html#contato">Contato</a>
        </nav>

        <div class="acoes">
            <a class="botao botao-branco" href="cadastro_pessoa.html">Cadastrar-se</a>
        </div>
    </header>

    <main class="conteudo-login">
        
        <div class="robo-area">
            <img class="gif-robo" src="../img/robologin.gif" alt="Robô DevIN">
        </div>

        <div class="area-login">
            <h1>Login</h1>
            <form action="../php/login.php" method="POST">
                <div class="grupo-campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Seu email..." required>
                </div>
                
                <div class="grupo-campo campo-senha input-container">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha..." required>
                    
                    <button type="button" id="btn-mostrar">
                        <img id="img-olho" src="../img/olho_fechado.png" alt="Mostrar Senha">
                    </button>
                </div>

                <a href="#" class="link-esqueceu">Esqueceu a Senha?</a>

                <button type="submit" class="botao-entrar">Entrar</button>
            </form>
            
            <p class="texto-politica">
                Ao continuar, você reconhece a <a href="politica_privacidade.html">Política de Privacidade</a> do DevIN.
            </p>
        </div>
<script src="../js/login.js"></script>
    </main>

</body>
